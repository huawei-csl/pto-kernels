name: Multi-platform (x86, aarch64)

on:
  workflow_dispatch:

jobs:
  manylinux-wheels-build:
    name: Manylinux wheels (${{ matrix.target.npu_device }}, ${{ matrix.platform.arch }}, py${{ matrix.python.py_ver }})

    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-22.04, arch: x86_64}
          - {os: ubuntu-22.04-arm, arch: aarch64}
        python:
          - {python_version: py3.10, py_ver: "310"}
          - {python_version: py3.11, py_ver: "311"}
          - {python_version: py3.12, py_ver: "312"}
        target:
          - {npu_device: 910b, image_version: 9.2.0-beta.1, soc_version: Ascend910B2, base_mode: MEMORY}
          - {npu_device: "950", image_version: 9.2.1, soc_version: Ascend950, base_mode: REGISTER}

    runs-on: ${{ matrix.platform.os }}

    container:
      image: quay.io/ascend/manylinux:${{ matrix.target.image_version }}-${{ matrix.target.npu_device }}-manylinux_2_34-${{ matrix.python.python_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show OS
        run: cat /etc/os-release

      - name: Run bash commands
        shell: bash
        env:
          SOC_VERSION: ${{ matrix.target.soc_version }}
          BASE_MODE: ${{ matrix.target.base_mode }}
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/`uname -i`-linux/devlib # to avoid libascend_hal.so issue
          pip3 install pyyaml setuptools pytest packaging pybind11[global]
          pip3 install -r requirements.txt
          make clean wheel

      - name: Install built wheel
        run: pip install pto_kernels-*.whl

      - name: Inspect installed package
        run: |
          export SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
          echo "$SITE_PACKAGES"
          yum install -y -q tree
          tree ${SITE_PACKAGES}/pto_kernels

      - name: Show wheel info
        run: auditwheel show pto_kernels*.whl

      - name: Repair wheel
        run: |
          export SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
          export LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${SITE_PACKAGES}/pto_kernels/:${SITE_PACKAGES}/pto_kernels/lib:${SITE_PACKAGES}/pto_kernels/lib64
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/`uname -i`-linux/devlib # to avoid libascend_hal.so issue

          auditwheel repair \
            --plat manylinux_2_34_${{ matrix.platform.arch }} \
            --exclude libtorch.so \
            --exclude libtorch_cpu.so \
            --exclude libc10.so \
            --exclude libhccl.so \
            --exclude libprofapi.so \
            --exclude libtorch_npu.so \
            --exclude libascend*.so \
            --exclude libc_sec.so \
            --exclude liberror_manager.so \
            --exclude libmmpa.so \
            --exclude libmsprofiler.so \
            --exclude libplatform.so \
            --exclude libruntime.so \
            --exclude libruntime_common.so \
            --exclude libunified_dlog.so \
            pto_kernels*.whl \
            -w wheelhouse/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pto_kernels-${{ matrix.target.npu_device }}-${{ matrix.python.py_ver }}-${{ matrix.platform.arch }}
          path: wheelhouse/pto_kernels*manylinux*.whl
          retention-days: 1
