default:
  tags: [cpu]

stages:
   - build_in_docker
   - test
   - bench

# Global environment for the taskqueue client (task-submit).
# Available to every job; invoke the client as ${TASKQUEUE_BIN}/task-submit.
variables:
  TASKQUEUE_BIN: /var/lib/taskqueue/bin
  TASKQUEUE_CONF: /var/lib/taskqueue/taskqueue.conf


# Define the workflow rules manually to make sure only a single pipeline
# is created for each MR update. Without that, GitLab creates one pipeline
# for branch update and one for MR update.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never


.build_config: &build_config
  image: quay.io/ascend/cann:9.2.1-${NPU}-ubuntu22.04-py3.12
  parallel:
    matrix:
      - {NPU: 910b}
      - {NPU: 950}
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging
    - pip3 install -r requirements.txt

build_docker:
  stage: build_in_docker
  tags:
    - cpu # Build docker using CPU
  <<: *build_config
  script:
    - make wheel

build_and_test_x86_910B4:
  image: quay.io/ascend/cann:9.2.1-910b-ubuntu22.04-py3.12
  stage: test
  tags:
    - docker_npu # Build and test on-device NPU (x86-64 / 910B4)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging
    - pip3 install -r requirements.txt
  script:
    - make setup_once
    - make wheel
    - pip install pto_kernels*.whl
    - python3 -m pytest -v tests/

build_and_test_aarch64_910B2_py3.12:
  image: quay.io/ascend/cann:9.2.1-910b-ubuntu22.04-py3.12
  stage: test
  tags:
    - docker_npu_910B2 # Build and test on-device (aarch64 / 910B2)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging
    - pip3 install -r requirements.txt
  script:
    - make setup_once
    - make wheel
    - pip install pto_kernels*.whl
    - ${TASKQUEUE_BIN}/task-submit --device auto --run "python3 -m pytest tests/"
  when: manual
  allow_failure: true

###################################################
# On-device unit tests using pip install pto-kernels #
###################################################
test_pypi_x86_910B4:
  image: quay.io/ascend/cann:9.2.1-910b-ubuntu22.04-py3.12
  stage: test
  tags:
    - docker_npu # Build and test on-device NPU (x86-64 / 910B4)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging
    - pip3 install -r requirements.txt
  script:
    - make setup_once
    - pip install pto-kernels
    - python3 -m pytest -v tests/
  when: manual
  allow_failure: true

test_pypi_aarch64_910B2_py3.12:
  image: quay.io/ascend/cann:9.2.1-910b-ubuntu22.04-py3.12
  stage: test
  tags:
    - docker_npu_910B2 # Build and test on-device (aarch64 / 910B2)
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging
    - pip3 install -r requirements.txt
  script:
    - make setup_once
    - pip install pto-kernels
    - ${TASKQUEUE_BIN}/task-submit --device auto --timeout 1200 --run "python3 -m pytest tests/"
  when: manual
  allow_failure: true

######################################
# On-device test of examples/jit_cpp #
######################################
test_examples_on_x86_910B4:
  image: quay.io/ascend/cann:9.2.1-910b-ubuntu22.04-py3.12
  tags:
    - docker_npu # Build and test on-device NPU (x86-64 / 910B4)
  parallel:
    matrix:
      - EXAMPLE: ["scan", "silu_dynamic"]
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging
    - pip3 install -r requirements.txt
  script:
    - echo "Testing example ${EXAMPLE}"
    - make setup_once
    - cd examples/jit_cpp/${EXAMPLE}
    - export PTO_LIB_PATH=${ASCEND_TOOLKIT_HOME}
    - python3 run_${EXAMPLE}.py

##########################################################
# On-device benchmarks (benchmarking/bench_*.py), manual #
##########################################################
benchmark_aarch64_910B2_py3.12:
  image: quay.io/ascend/cann:9.2.1-910b-ubuntu22.04-py3.12
  stage: bench
  tags:
    - docker_npu_910B2 # Benchmark on-device (aarch64 / 910B2)
  parallel:
    matrix:
      - BENCH:
          - bench_cube_norm
          - bench_cube_reduce
          - bench_cube_reduce_dim
          - bench_tri_inv_accuracy_rec_unroll_vs_col_sweep
          - bench_tri_inv_col_sweep
          - bench_tri_inv_rank_one
          - bench_tri_inv_rec_unroll
          - bench_tri_inv_rec_unroll_bf16_vs_fp16
          - bench_tri_inv_rec_unroll_vs_rank_one
  before_script:
    - source /usr/local/Ascend/ascend-toolkit/set_env.sh
    - pip3 install pyyaml setuptools pytest packaging matplotlib
    - pip3 install -r requirements.txt
  script:
    - echo "Benchmarking ${BENCH}"
    - make setup_once
    - make wheel
    - pip install pto_kernels*.whl
    - ${TASKQUEUE_BIN}/task-submit --device auto --timeout 600 --run "python3 benchmarking/${BENCH}.py"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - benchmark_data/*.png
      - benchmark_data/*.csv
  when: manual
  allow_failure: true
